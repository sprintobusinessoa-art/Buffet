/* ==========================================================================
   Wared Design System Tokens
   ========================================================================== */
:root {
  /* Brand & Surface Colors (extracted from Figma) */
  --color-bg-app: #F5F7F8;
  --color-bg-card: #FFFFFF;
  --color-bg-subtle: #F8FAFB;
  --color-bg-sidebar: #132E39;
  --color-bg-sidebar-elevated: #19333C;
  --color-bg-camera: #19333C;

  /* Primary Teal & Mint */
  --color-primary: #087E78;
  --color-primary-hover: #066863;
  --color-primary-light: #E6F4F1;
  --color-primary-tint: #EFF8F6;
  --color-primary-border: #99D5CF;

  /* Status Colors */
  --color-success: #087E78;
  --color-success-bg: #E6F4F1;
  --color-warning: #B45309;
  --color-warning-bg: #FEF3C7;
  --color-warning-border: #FCD34D;
  --color-danger: #DC2626;
  --color-danger-bg: #FEF2F2;
  --color-info-bg: #F1F5F7;

  /* Text Colors */
  --color-text-primary: #132E39;
  --color-text-secondary: #637880;
  --color-text-muted: #8FA1A8;
  --color-text-on-dark: #FFFFFF;
  --color-text-on-dark-muted: #9CB2B9;

  /* Borders & Dividers */
  --color-border: #DCE6E8;
  --color-border-light: #EAEFF1;
  --color-bracket: #4D5D5C;

  /* Typography */
  --font-sans: 'IBM Plex Sans Arabic', 'Cairo', system-ui, -apple-system, sans-serif;

  /* Radii */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 9999px;

  /* Shadows */
  --shadow-card: 0 1px 3px rgba(19, 46, 57, 0.04), 0 1px 2px rgba(19, 46, 57, 0.02);
  --shadow-elevated: 0 10px 25px -5px rgba(19, 46, 57, 0.08), 0 4px 10px -2px rgba(19, 46, 57, 0.04);

  /* Layout */
  --sidebar-width: 260px;
  --header-height: 64px;
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* ==========================================================================
   Wared Layout — Clean Focused 3-Step Shell (No Sidebar)
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  background-color: var(--color-bg-app);
  color: var(--color-text-primary);
  direction: rtl;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  width: 100%;
}

.topbar {
  height: var(--header-height);
  background: var(--color-bg-card);
  border-bottom: 1px solid var(--color-border-light);
  position: sticky;
  top: 0;
  z-index: 30;
}

.topbar-inner {
  max-width: 1160px;
  height: 100%;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.page-content {
  padding: 28px 24px 56px;
  max-width: 1160px;
  width: 100%;
  margin: 0 auto;
  flex: 1;
}

@media (max-width: 639px) {
  .topbar-inner {
    padding: 0 16px;
  }
  .page-content {
    padding: 20px 16px 40px;
  }
}

/* ==========================================================================
   Wared UI Components (Buttons, Cards, Stepper, Camera, Inputs)
   ========================================================================== */
.card {
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

.btn-primary {
  background-color: var(--color-primary);
  color: #FFFFFF;
  border: none;
  border-radius: var(--radius-md);
  font-weight: 600;
  cursor: pointer;
  transition: background-color var(--transition-fast), transform var(--transition-fast);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary:hover {
  background-color: var(--color-primary-hover);
}
.btn-primary:active {
  transform: scale(0.99);
}

.btn-secondary {
  background-color: var(--color-bg-card);
  color: var(--color-text-primary);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-weight: 600;
  cursor: pointer;
  transition: background-color var(--transition-fast), border-color var(--transition-fast);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-secondary:hover {
  background-color: var(--color-bg-subtle);
  border-color: var(--color-text-muted);
}

/* Stepper Cards */
.stepper-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.step-pill {
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all var(--transition-fast);
}
.step-pill.active {
  background: var(--color-primary-light);
  border-color: var(--color-primary-border);
}
.step-pill.completed {
  cursor: pointer;
}
.step-pill.completed:hover {
  border-color: var(--color-primary-border);
}
.step-badge {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}
.step-pill.active .step-badge {
  background: var(--color-primary);
  color: #FFFFFF;
}
.step-pill.completed .step-badge {
  background: var(--color-primary-light);
  color: var(--color-primary);
}
.step-pill.pending .step-badge {
  background: var(--color-bg-app);
  color: var(--color-text-secondary);
}

@media (max-width: 639px) {
  .stepper-grid {
    gap: 8px;
  }
  .step-pill {
    flex-direction: column;
    padding: 10px 6px;
    text-align: center;
    gap: 6px;
  }
  .step-pill span.step-label {
    font-size: 11px;
    line-height: 1.3;
  }
}

/* Camera Viewfinder */
.viewfinder {
  background-color: var(--color-bg-camera);
  border-radius: var(--radius-md);
  position: relative;
  overflow: hidden;
  padding: 20px;
  min-height: 410px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.viewfinder-frame {
  position: relative;
  margin: 16px auto;
  padding: 16px;
  max-width: 310px;
  width: 100%;
}
.bracket {
  position: absolute;
  width: 22px;
  height: 22px;
  border-color: #3BB2AC;
  border-style: solid;
  pointer-events: none;
}
.bracket-tr { top: 0; right: 0; border-width: 2.5px 2.5px 0 0; border-top-right-radius: 6px; }
.bracket-tl { top: 0; left: 0; border-width: 2.5px 0 0 2.5px; border-top-left-radius: 6px; }
.bracket-br { bottom: 0; right: 0; border-width: 0 2.5px 2.5px 0; border-bottom-right-radius: 6px; }
.bracket-bl { bottom: 0; left: 0; border-width: 0 0 2.5px 2.5px; border-bottom-left-radius: 6px; }

.shutter-btn {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #FFFFFF;
  border: 4px solid rgba(255, 255, 255, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-bg-camera);
  cursor: pointer;
  transition: transform 120ms ease, box-shadow 120ms ease;
}
.shutter-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 0 4px rgba(8, 126, 120, 0.35);
}

/* Scan line animation during capture */
@keyframes scanMove {
  0% { top: 8%; opacity: 0.2; }
  50% { top: 88%; opacity: 0.9; }
  100% { top: 8%; opacity: 0.2; }
}
.scan-line {
  position: absolute;
  left: 12px;
  right: 12px;
  height: 2px;
  background: linear-gradient(90deg, transparent, #3BB2AC, transparent);
  box-shadow: 0 0 10px #3BB2AC;
  animation: scanMove 1.4s ease-in-out infinite;
  display: none;
}
.viewfinder.scanning .scan-line {
  display: block;
}

/* Form Controls */
.wared-input {
  width: 100%;
  background: var(--color-bg-subtle);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 14px;
  font-family: inherit;
  color: var(--color-text-primary);
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.wared-input:focus {
  outline: none;
  border-color: var(--color-primary);
  background: #FFFFFF;
  box-shadow: 0 0 0 3px rgba(8, 126, 120, 0.12);
}
.wared-input.highlight-teal {
  background: var(--color-primary-tint);
  border-color: var(--color-primary-border);
  font-weight: 700;
}

/* Toast Notification */
.toast-container {
  position: fixed;
  bottom: 24px;
  left: 24px;
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast-item {
  background: var(--color-bg-sidebar);
  color: #FFFFFF;
  padding: 12px 18px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-elevated);
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  border-right: 4px solid var(--color-primary);
}

(function() {
'use strict';
/* ==========================================================================
   Pure Formatting & Security Sanitization Utilities
   ========================================================================== */
function toArabicDigits(value) {
  const map = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
  return String(value).replace(/\d/g, (d) => map[Number(d)]);
}

function formatCurrency(amount, decimals = 0) {
  const num = Number(amount);
  if (!Number.isFinite(num)) return '٠';
  const formatted = num.toLocaleString('en-US', {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  });
  return toArabicDigits(formatted);
}

function formatNumber(value, maxDecimals = 2) {
  const num = Number(value);
  if (!Number.isFinite(num)) return '٠';
  const formatted = num.toLocaleString('en-US', {
    minimumFractionDigits: 0,
    maximumFractionDigits: maxDecimals
  });
  return toArabicDigits(formatted);
}

function formatTodayArabic() {
  try {
    return new Intl.DateTimeFormat('ar-EG', {
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    }).format(new Date());
  } catch {
    return '٢٠ نوفمبر ٢٠٢٦';
  }
}

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/**
 * Strictly allows safe raster image data URIs only (blocks SVG/XSS/javascript:).
 */
function sanitizeImageDataUrl(url) {
  if (typeof url !== 'string') return '';
  const trimmed = url.trim();
  const safeRasterRe = /^data:image\/(png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+/=]+$/;
  return safeRasterRe.test(trimmed) ? trimmed : '';
}

/* ==========================================================================
   Pure Business & Math Calculations (Profit, Expiry Status, Order Summary)
   ========================================================================== */

function calcUnitCost(cartonBuyPrice, piecesPerCarton) {
  const buy = Number(cartonBuyPrice) || 0;
  const pieces = Number(piecesPerCarton) || 0;
  if (pieces <= 0 || buy < 0) return 0;
  return Number((buy / pieces).toFixed(2));
}

function calcItemTotal(item) {
  const buy = Number(item?.cartonBuyPrice) || 0;
  const qty = Number(item?.cartonQty) || 0;
  if (buy < 0 || qty < 0) return 0;
  return Number((buy * qty).toFixed(2));
}

/**
 * Calculates profit per unit, profit per carton, margin %, and loss flag.
 */
function calcProfitMetrics(item) {
  const unitCost = calcUnitCost(item?.cartonBuyPrice, item?.piecesPerCarton);
  const unitSell = Number(item?.unitSellPrice) || 0;
  const cartonBuy = Number(item?.cartonBuyPrice) || 0;
  const cartonSell = Number(item?.cartonSellPrice) || 0;

  const unitProfit = Number((unitSell - unitCost).toFixed(2));
  const cartonProfit = Number((cartonSell - cartonBuy).toFixed(2));
  const marginPct = unitCost > 0 ? Number(((unitProfit / unitCost) * 100).toFixed(1)) : 0;
  const isLoss = (unitSell > 0 && unitProfit < 0) || (cartonSell > 0 && cartonProfit < 0);

  return { unitCost, unitProfit, cartonProfit, marginPct, isLoss };
}

/**
 * Returns { status: 'valid' | 'expiring-soon' | 'expired', daysLeft: number | null }
 */
function getExpiryStatus(expiryDate) {
  if (!expiryDate || typeof expiryDate !== 'string') {
    return { status: 'valid', daysLeft: null };
  }
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(expiryDate.trim());
  if (!match) return { status: 'valid', daysLeft: null };

  const now = new Date();
  const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const expDate = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])).getTime();
  const daysLeft = Math.ceil((expDate - todayMidnight) / (1000 * 60 * 60 * 24));

  if (daysLeft <= 0) return { status: 'expired', daysLeft };
  if (daysLeft <= 30) return { status: 'expiring-soon', daysLeft };
  return { status: 'valid', daysLeft };
}

function isItemExpired(expiryDate) {
  return getExpiryStatus(expiryDate).status === 'expired';
}

function calcOrderSummary(items = [], invoiceAmount = 0) {
  const itemCount = items.length;
  const totalCartons = items.reduce((sum, item) => sum + (Number(item.cartonQty) || 0), 0);
  const itemsTotal = items.reduce((sum, item) => sum + calcItemTotal(item), 0);
  const expiredCount = items.filter((item) => getExpiryStatus(item.expiryDate).status === 'expired').length;
  const expiringSoonCount = items.filter((item) => getExpiryStatus(item.expiryDate).status === 'expiring-soon').length;
  const targetAmount = Number(invoiceAmount) || 0;
  const diff = Number((itemsTotal - targetAmount).toFixed(2));
  const isMatched = itemCount > 0 && targetAmount > 0 && Math.abs(diff) < 0.01;

  return {
    itemCount,
    totalCartons,
    itemsTotal: Number(itemsTotal.toFixed(2)),
    expiredCount,
    expiringSoonCount,
    targetAmount,
    diff,
    isMatched
  };
}

/* ==========================================================================
   Isolated Google Drive Upload Service
   ==========================================================================
   Edit this module independently when wiring your live Google Drive OAuth
   token or backend endpoint — zero UI or calculation coupling.

const DRIVE_CONFIG = {
  folderName: 'فواتير وارد - Google Drive',
  folderId: 'WARED_INVOICES_FOLDER'
};

/**
 * Simulates uploading the captured invoice image to Google Drive in preview,
 * and provides a clean integration point for the live Drive v3 multipart API.
 */
async function queueInvoiceToDrive({ imageDataUrl, invoiceNumber, supplierName }) {
  // Simulate async upload latency
  await new Promise((resolve) => setTimeout(resolve, 450));

  return {
    ok: true,
    driveFileName: `فاتورة_${invoiceNumber || 'جديدة'}.png`,
    folderName: DRIVE_CONFIG.folderName,
    syncedAt: new Date().toISOString(),
    hasImage: Boolean(imageDataUrl),
    supplierName
  };
}

/* ==========================================================================
   Isolated Device Camera Service (MediaDevices + Canvas Frame Capture)
   ========================================================================== */

let activeStream = null;

async function startDeviceCamera(videoEl) {
  stopDeviceCamera();

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return { ok: false, error: 'المتصفح لا يدعم فتح الكاميرا مباشرة، يمكنك رفع صورة الفاتورة.' };
  }

  try {
    activeStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    if (videoEl) {
      videoEl.srcObject = activeStream;
      await videoEl.play();
    }
    return { ok: true };
  } catch (err) {
    return {
      ok: false,
      error: 'تعذر الوصول لكاميرا الجهاز. اسمح بصلاحية الكاميرا أو ارفع صورة الفاتورة من جهازك.'
    };
  }
}

function captureFrameFromVideo(videoEl) {
  if (!videoEl || !videoEl.videoWidth || !videoEl.videoHeight) {
    return null;
  }
  const canvas = document.createElement('canvas');
  canvas.width = videoEl.videoWidth;
  canvas.height = videoEl.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/png');
}

function stopDeviceCamera() {
  if (activeStream) {
    activeStream.getTracks().forEach((track) => track.stop());
    activeStream = null;
  }
}

/* ==========================================================================
   Centralized Reactive Store — Auto-Save Recovery & Custom Inputs
   ========================================================================== */




const STORAGE_KEY = 'wared_sequential_orders_v1';
const DRAFT_RECOVERY_KEY = 'wared_active_draft_v1';

function loadPersistedOrders() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed?.orders) ? parsed.orders : [];
  } catch {
    return [];
  }
}

function savePersistedOrders(orders) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ orders }));
  } catch {
    // Ignore storage errors
  }
}

function saveDraftForRecovery(draft) {
  try {
    if (!draft.invoiceCaptured || draft.isSubmitted) {
      localStorage.removeItem(DRAFT_RECOVERY_KEY);
      return;
    }
    localStorage.setItem(DRAFT_RECOVERY_KEY, JSON.stringify(draft));
  } catch {
    // If image data URL exceeds quota, retry saving draft without image data
    try {
      const lite = { ...draft, capturedImageUrl: null };
      localStorage.setItem(DRAFT_RECOVERY_KEY, JSON.stringify(lite));
    } catch {
      // Ignore
    }
  }
}

function loadRecoveredDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_RECOVERY_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed && parsed.invoiceCaptured && !parsed.isSubmitted && Array.isArray(parsed.items)) {
      return parsed;
    }
    return null;
  } catch {
    return null;
  }
}

function clearRecoveredDraft() {
  try {
    localStorage.removeItem(DRAFT_RECOVERY_KEY);
  } catch {
    // Ignore
  }
}

function createCleanSequentialDraft() {
  const base = createDefaultDraft();
  return {
    ...base,
    step: 1,
    invoiceCaptured: false,
    reviewConfirmed: false,
    isSubmitted: false,
    customSupplierMode: false,
    driveStatus: 'idle',
    driveFileName: '',
    driveFolderName: DRIVE_CONFIG.folderName
  };
}

const recovered = loadRecoveredDraft();

let state = {
  helpModalOpen: false,
  imagePreviewModalOpen: false,
  confirmNewDraftModalOpen: false,
  flashEnabled: false,
  isScanning: false,
  cameraStatus: 'idle',
  cameraError: '',
  wasRecovered: Boolean(recovered),
  draft: recovered || createCleanSequentialDraft(),
  orders: loadPersistedOrders(),
  toasts: []
};

const listeners = new Set();

function getState() {
  return state;
}

function hasUnsentWork(currentState = state) {
  const { draft } = currentState;
  return Boolean(draft.invoiceCaptured && !draft.isSubmitted);
}

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function notify(persistDraft = true) {
  if (persistDraft) {
    saveDraftForRecovery(state.draft);
  }
  listeners.forEach((fn) => fn(state));
}

const actions = {
  toggleHelpModal(open) {
    state = { ...state, helpModalOpen: open };
    notify(false);
  },

  toggleImagePreviewModal(open) {
    state = { ...state, imagePreviewModalOpen: open };
    notify(false);
  },

  toggleConfirmNewDraftModal(open) {
    state = { ...state, confirmNewDraftModalOpen: open };
    notify(false);
  },

  toggleFlash() {
    state = { ...state, flashEnabled: !state.flashEnabled };
    notify(false);
  },

  setCameraState(cameraStatus, cameraError = '') {
    state = { ...state, cameraStatus, cameraError };
    notify(false);
  },

  setStep(targetStep) {
    const { draft } = state;
    if (targetStep >= 2 && !draft.invoiceCaptured) {
      actions.showToast('لازم تصوّر الفاتورة أو ترفعها الأول قبل مراجعة البيانات');
      return;
    }
    if (targetStep === 3 && !draft.reviewConfirmed) {
      actions.showToast('لازم تأكد اسم المورد والمبلغ في الخطوة الثانية الأول');
      return;
    }
    state = { ...state, draft: { ...draft, step: targetStep } };
    notify();
  },

  async completeCapture(capturedDataUrl) {
    if (state.isScanning || !capturedDataUrl) return;
    state = {
      ...state,
      isScanning: true,
      draft: {
        ...state.draft,
        driveStatus: 'uploading'
      }
    };
    notify(false);

    const driveRes = await queueInvoiceToDrive({
      imageDataUrl: capturedDataUrl,
      invoiceNumber: state.draft.invoiceNumber,
      supplierName: state.draft.supplierName
    });

    state = {
      ...state,
      isScanning: false,
      draft: {
        ...state.draft,
        capturedImageUrl: capturedDataUrl,
        invoiceCaptured: true,
        isSubmitted: false,
        driveStatus: driveRes.ok ? 'synced' : 'idle',
        driveFileName: driveRes.driveFileName,
        step: 2
      }
    };
    notify();
    actions.showToast('تم تصوير الفاتورة بنجاح');
  },

  confirmReviewAndProceed() {
    const { draft } = state;
    if (!draft.invoiceCaptured) {
      actions.showToast('لازم تصوّر الفاتورة الأول');
      return;
    }
    if (!draft.supplierName.trim()) {
      actions.showToast('يرجى اختيار أو كتابة اسم المورد أولاً');
      return;
    }
    if ((Number(draft.invoiceAmount) || 0) <= 0) {
      actions.showToast('يرجى إدخال مبلغ فاتورة صحيح أكبر من صفر');
      return;
    }
    state = {
      ...state,
      draft: {
        ...draft,
        reviewConfirmed: true,
        step: 3
      }
    };
    notify();
  },

  updateDraftField(field, value) {
    state = {
      ...state,
      draft: { ...state.draft, [field]: value, isSubmitted: false }
    };
    saveDraftForRecovery(state.draft);
  },

  updateDraftFieldAndRender(field, value, extra = {}) {
    state = {
      ...state,
      draft: { ...state.draft, [field]: value, isSubmitted: false, ...extra }
    };
    notify();
  },

  requestNewDraft() {
    if (hasUnsentWork(state)) {
      actions.toggleConfirmNewDraftModal(true);
      return;
    }
    actions.forceNewDraft();
  },

  forceNewDraft() {
    clearRecoveredDraft();
    const nextNum = 1024 + state.orders.length;
    const fresh = createCleanSequentialDraft();
    fresh.id = 'inv-' + Date.now();
    fresh.invoiceNumber = toArabicDigits(nextNum);
    fresh.invoiceDate = formatTodayArabic();
    state = {
      ...state,
      confirmNewDraftModalOpen: false,
      cameraStatus: 'idle',
      cameraError: '',
      wasRecovered: false,
      draft: fresh
    };
    notify(false);
    actions.showToast('تم فتح فاتورة جديدة — ابدأ بتصوير الفاتورة');
  },

  toggleItemExpanded(itemId) {
    const items = state.draft.items.map((item) =>
      item.id === itemId ? { ...item, expanded: !item.expanded } : item
    );
    state = { ...state, draft: { ...state.draft, items } };
    notify();
  },

  updateItemField(itemId, field, value) {
    const items = state.draft.items.map((item) =>
      item.id === itemId ? { ...item, [field]: value } : item
    );
    state = { ...state, draft: { ...state.draft, items, isSubmitted: false } };
    saveDraftForRecovery(state.draft);
  },

  enableCustomItemName(itemId) {
    const items = state.draft.items.map((item) =>
      item.id === itemId ? { ...item, isCustomName: true, name: '' } : item
    );
    state = { ...state, draft: { ...state.draft, items, isSubmitted: false } };
    notify();
  },

  applyItemPreset(itemId, presetName) {
    const preset = PRODUCT_PRESETS.find((p) => p.name === presetName);
    const items = state.draft.items.map((item) => {
      if (item.id !== itemId) return item;
      if (!preset) return { ...item, name: presetName, isCustomName: false };
      return {
        ...item,
        name: preset.name,
        isCustomName: false,
        cartonBuyPrice: preset.cartonBuyPrice,
        piecesPerCarton: preset.piecesPerCarton,
        cartonSellPrice: preset.cartonSellPrice,
        unitSellPrice: preset.unitSellPrice,
        expiryDate: preset.expiryDate || ''
      };
    });
    state = { ...state, draft: { ...state.draft, items, isSubmitted: false } };
    notify();
  },

  addItem() {
    const newId = 'item-' + Date.now();
    const defaultPreset = PRODUCT_PRESETS[2];
    const collapsedExisting = state.draft.items.map((it) => ({ ...it, expanded: false }));
    const newItem = {
      id: newId,
      name: defaultPreset.name,
      isCustomName: false,
      cartonBuyPrice: defaultPreset.cartonBuyPrice,
      piecesPerCarton: defaultPreset.piecesPerCarton,
      cartonQty: 1,
      cartonSellPrice: defaultPreset.cartonSellPrice,
      unitSellPrice: defaultPreset.unitSellPrice,
      expiryDate: defaultPreset.expiryDate || '',
      expanded: true
    };
    state = {
      ...state,
      draft: {
        ...state.draft,
        isSubmitted: false,
        items: [...collapsedExisting, newItem]
      }
    };
    notify();
  },

  removeItem(itemId) {
    if (state.draft.items.length <= 1) {
      actions.showToast('يجب أن تحتوي الطلبية على صنف واحد على الأقل');
      return;
    }
    const items = state.draft.items.filter((it) => it.id !== itemId);
    if (!items.some((it) => it.expanded)) {
      items[0] = { ...items[0], expanded: true };
    }
    state = { ...state, draft: { ...state.draft, isSubmitted: false, items } };
    notify();
  },

  saveOrder(status = 'saved') {
    const summary = calcOrderSummary(state.draft.items, state.draft.invoiceAmount);
    if (status === 'saved' && !summary.isMatched) {
      actions.showToast('لا يمكن إرسال الطلبية قبل تطابق إجمالي الأصناف مع مبلغ الفاتورة');
      return;
    }
    if (status === 'saved' && state.draft.items.some((it) => !String(it.name || '').trim())) {
      actions.showToast('يرجى كتابة اسم كل صنف قبل الإرسال');
      return;
    }

    const orderRecord = {
      id: state.draft.id,
      invoiceNumber: state.draft.invoiceNumber,
      supplierName: state.draft.supplierName,
      invoiceDate: state.draft.invoiceDate,
      invoiceAmount: Number(state.draft.invoiceAmount) || 0,
      driveFileName: state.draft.driveFileName,
      status,
      items: state.draft.items.map(({ expanded, isCustomName, ...rest }) => rest)
    };
    const existingIdx = state.orders.findIndex((o) => o.id === orderRecord.id);
    const nextOrders =
      existingIdx >= 0
        ? state.orders.map((o, idx) => (idx === existingIdx ? orderRecord : o))
        : [orderRecord, ...state.orders];

    savePersistedOrders(nextOrders);
    if (status === 'saved') {
      clearRecoveredDraft();
    }
    state = {
      ...state,
      orders: nextOrders,
      draft: {
        ...state.draft,
        isSubmitted: status === 'saved'
      }
    };
    notify(status !== 'saved');
    actions.showToast(
      status === 'saved'
        ? 'تم إرسال وحفظ الطلبية بنجاح'
        : 'تم حفظ الفاتورة كمسودة'
    );
  },

  showToast(message) {
    const id = 'toast-' + Date.now() + Math.random().toString(16).slice(2);
    state = { ...state, toasts: [...state.toasts, { id, message }] };
    notify(false);
    setTimeout(() => {
      state = { ...state, toasts: state.toasts.filter((t) => t.id !== id) };
      notify(false);
    }, 3400);
  }
};

/* ==========================================================================
   3-Step Horizontal Stepper Component (With Sequential Lock Indicators)
   ========================================================================== */

const STEPS = [
  { num: 1, label: 'تصوير الفاتورة' },
  { num: 2, label: 'مراجعة البيانات' },
  { num: 3, label: 'تسجيل الطلبية' }
];

function renderStepper(draft) {
  const currentStep = draft.step;

  return `
    <div class="stepper-grid mb-6" role="tablist" aria-label="خطوات تسجيل الفاتورة">
      ${STEPS.map((s) => {
        const isLocked =
          (s.num === 2 && !draft.invoiceCaptured) ||
          (s.num === 3 && (!draft.invoiceCaptured || !draft.reviewConfirmed));
        const isCompleted =
          (s.num === 1 && draft.invoiceCaptured && currentStep > 1) ||
          (s.num === 2 && draft.reviewConfirmed && currentStep > 2);
        const status = s.num === currentStep ? 'active' : isCompleted ? 'completed' : 'pending';

        return `
          <div
            class="step-pill ${status} ${isLocked ? 'opacity-70 cursor-not-allowed' : 'cursor-pointer'}"
            data-action="go-step"
            data-step="${s.num}"
            role="button"
            tabindex="0"
          >
            <span class="step-badge">
              ${status === 'completed'
                ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>'
                : toArabicDigits(s.num)}
            </span>
            <span class="step-label flex-1 text-sm font-semibold ${
              status === 'active'
                ? 'text-[#087E78]'
                : status === 'completed'
                ? 'text-[#132E39]'
                : 'text-[#637880]'
            }">${s.label}</span>
            ${isLocked ? '<i data-lucide="lock" class="w-3.5 h-3.5 text-[#8FA1A8] shrink-0 hidden sm:inline-block"></i>' : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[11px] text-[#8FA1A8]">ج.م</span>

                <div data-profit-slot="${item.id}">

        <!-- Add Another Item Button -->
        <button

      <!-- Left Column: Order Summary -->
      <div class="lg:col-span-4" id="summary-slot">
        ${renderSummaryPanel(state)}
      </div>
    </div>
  `;

            <h3 class="text-base font-bold text-[#132E39]">خطوات تسجيل الفاتورة</h3>
            <button type="button" data-action="close-help" class="text-[#8FA1A8] hover:text-[#132E39] cursor-pointer">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>
          <ol class="space-y-2.5 text-xs text-[#637880] list-decimal pr-4 leading-relaxed">
            <li><strong class="text-[#132E39]">تصوير الفاتورة (إجباري):</strong> افتح كاميرا الجهاز وصوّر الفاتورة أو ارفع صورتها من جهازك.</li>
            <li><strong class="text-[#132E39]">مراجعة البيانات:</strong> راجع اسم المورد ومبلغ الفاتورة أو أضف مورداً جديداً يدوياً.</li>
            <li><strong class="text-[#132E39]">تسجيل الطلبية:</strong> أدخل الأصناف وتاريخ الانتهاء وتابع هامش الربح، ولن يتم الإرسال إلا عند تطابق الإجمالي.</li>
          </ol>
          <button type="button" data-action="close-help" class="btn-primary w-full py-2.5 text-xs mt-5">فهمت، ابدأ الآن</button>
        </div>
      </div>
    `;
  }

  const safeModalImg = sanitizeImageDataUrl(state.draft.capturedImageUrl);
  if (state.imagePreviewModalOpen && safeModalImg) {
    html += `
      <div class="fixed inset-0 bg-[#132E39]/75 backdrop-blur-xs z-50 flex items-center justify-center p-4" data-backdrop="close-image-modal">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-4 shadow-2xl">
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm font-bold text-[#132E39]">معاينة الفاتورة الأصلية</span>
            <button type="button" data-action="close-image-modal" class="text-[#8FA1A8] hover:text-[#132E39] cursor-pointer">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>
          <img src="${safeModalImg}" alt="معاينة الفاتورة" class="max-h-[75vh] w-full object-contain rounded-xl bg-[#F5F7F8]" />
        </div>
      </div>
    `;
  }

  return html;
}

async function initCameraIfStepOne(state) {
  if (state.draft.step === 1) {
    const videoEl = document.getElementById('camera-video');
    if (videoEl && state.cameraStatus === 'idle') {
      const res = await startDeviceCamera(videoEl);
      if (res.ok) {
        actions.setCameraState('active', '');
      } else {
        actions.setCameraState('error', res.error);
      }
    }
  } else {
    stopDeviceCamera();
  }
}

function attachLogoFallback() {
  const logoImg = document.getElementById('brand-logo-img');
  const logoFallback = document.getElementById('brand-logo-fallback');
  if (!logoImg || !logoFallback) return;

  logoImg.addEventListener('error', () => {
    logoImg.classList.add('hidden');
    logoFallback.classList.remove('hidden');
  }, { once: true });

  logoImg.addEventListener('load', () => {
    logoImg.classList.remove('hidden');
    logoFallback.classList.add('hidden');
  }, { once: true });
}

function renderApp(state) {
  const root = document.getElementById('app-root');
  if (!root) return;

  const { draft } = state;
  let stepBody = '';
  if (draft.step === 1) stepBody = renderStepCapture(state);
  else if (draft.step === 2) stepBody = renderStepReview(state);
  else stepBody = renderStepOrder(state);

  root.innerHTML = `
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="flex items-center gap-3">
            <!-- Wide Landscape Logo Slot (loads logo.png if present) -->
            <div class="flex items-center">
              <img
                id="brand-logo-img"
                src="${BRAND_LOGO_PATH}"
                alt="شعار وارد"
                class="h-9 sm:h-10 w-auto max-w-[150px] object-contain"
              />
              <div
                id="brand-logo-fallback"
                class="hidden h-9 px-3 rounded-xl border border-dashed border-[#A7DCD7] bg-[#EFF8F6] text-[#087E78] items-center justify-center text-xs font-bold whitespace-nowrap flex"
              >
                LOGO (logo.png)
              </div>
            </div>
            <div class="text-lg font-extrabold text-[#132E39] leading-none">وارد</div>
          </div>

          <div class="flex items-center gap-2.5">
            <button
              type="button"
              data-action="start-new-draft"
              class="px-3.5 py-1.5 rounded-full border border-[#DCE6E8] bg-[#F8FAFB] hover:bg-[#EFF8F6] hover:border-[#99D5CF] text-xs font-semibold text-[#132E39] transition-colors cursor-pointer"
            >
              مسودة جديدة
            </button>

            <button
              type="button"
              data-action="open-help"
              class="p-2 rounded-full text-[#637880] hover:bg-[#F5F7F8] hover:text-[#132E39] transition-colors cursor-pointer"
              aria-label="مساعدة"
            >
              <i data-lucide="help-circle" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
      </header>

      <main class="page-content">
        <div class="mb-5">
          <h1 class="text-2xl sm:text-[28px] font-extrabold text-[#132E39] tracking-tight">فاتورة مشتريات جديدة</h1>
          <p class="text-xs sm:text-sm text-[#637880] mt-1">من صورة الفاتورة لطلبية منظمة، في ٣ خطوات متتالية.</p>
        </div>

        ${renderStepper(draft)}
        ${stepBody}
      </main>
    </div>

    ${renderModals(state)}

    <div class="toast-container" aria-live="polite">
      ${state.toasts.map((t) => `
        <div class="toast-item">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-[#3BB2AC] shrink-0"></i>
          <span>${escapeHtml(t.message)}</span>
        </div>
      `).join('')}
    </div>
  `;

  attachLogoFallback();

  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
  }

  if (draft.step === 1 && state.cameraStatus === 'active') {
    const videoEl = document.getElementById('camera-video');
    if (videoEl && !videoEl.srcObject) {
      startDeviceCamera(videoEl);
    }
  }

  if (lastRenderedStep !== draft.step) {
    lastRenderedStep = draft.step;
    initCameraIfStepOne(state);
  }
}

function syncItemDerivedDom(itemId) {
  const state = getState();
  const item = state.draft.items.find((it) => it.id === itemId);
  if (!item) return;

  const unitCostEl = document.querySelector(`[data-unit-cost="${itemId}"]`);
  if (unitCostEl) {
    unitCostEl.value = formatNumber(calcUnitCost(item.cartonBuyPrice, item.piecesPerCarton));
  }

  const itemTotalEl = document.querySelector(`[data-item-total="${itemId}"]`);
  if (itemTotalEl) {
    itemTotalEl.textContent = formatCurrency(calcItemTotal(item));
  }

  const profitSlot = document.querySelector(`[data-profit-slot="${itemId}"]`);
  if (profitSlot) {
    profitSlot.innerHTML = renderProfitPill(item);
  }

  const summarySlot = document.getElementById('summary-slot');
  if (summarySlot) {
    summarySlot.innerHTML = renderSummaryPanel(state);
  }

  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
  }
}

function setupEventDelegation() {
  window.addEventListener('beforeunload', (e) => {
    if (hasUnsentWork(getState())) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  document.addEventListener('click', async (e) => {
    if (e.target.dataset?.backdrop === 'close-help') {
      actions.toggleHelpModal(false);
      return;
    }
    if (e.target.dataset?.backdrop === 'close-image-modal') {
      actions.toggleImagePreviewModal(false);
      return;
    }
    if (e.target.dataset?.backdrop === 'close-confirm-draft') {
      actions.toggleConfirmNewDraftModal(false);
      return;
    }

    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;

    switch (action) {
      case 'open-help':
        actions.toggleHelpModal(true);
        break;
      case 'close-help':
        actions.toggleHelpModal(false);
        break;
      case 'open-image-modal':
        actions.toggleImagePreviewModal(true);
        break;
      case 'close-image-modal':
        actions.toggleImagePreviewModal(false);
        break;
      case 'close-confirm-draft':
        actions.toggleConfirmNewDraftModal(false);
        break;
      case 'confirm-new-draft':
        actions.forceNewDraft();
        break;
      case 'toggle-flash':
        actions.toggleFlash();
        break;
      case 'open-camera': {
        const videoEl = document.getElementById('camera-video');
        const res = await startDeviceCamera(videoEl);
        if (res.ok) actions.setCameraState('active', '');
        else actions.setCameraState('error', res.error);
        break;
      }
      case 'capture-invoice': {
        const videoEl = document.getElementById('camera-video');
        const frameUrl = captureFrameFromVideo(videoEl);
        if (!frameUrl) {
          actions.showToast('افتح كاميرا الجهاز أولاً أو ارفع صورة الفاتورة من جهازك');
          return;
        }
        stopDeviceCamera();
        actions.setCameraState('idle', '');
        await actions.completeCapture(frameUrl);
        break;
      }
      case 'go-step':
        actions.setStep(Number(target.dataset.step));
        break;
      case 'confirm-review':
        actions.confirmReviewAndProceed();
        break;
      case 'start-new-draft':
        actions.requestNewDraft();
        break;
      case 'toggle-item':
        actions.toggleItemExpanded(target.dataset.itemId);
        break;
      case 'add-item':
        actions.addItem();
        break;
      case 'remove-item':
        actions.removeItem(target.dataset.itemId);
        break;
      case 'save-order':
        actions.saveOrder('saved');
        break;
      case 'save-draft':
        actions.saveOrder('draft');
        break;
    }
  });

  document.addEventListener('change', (e) => {
    const target = e.target;
    const action = target.dataset?.action;
    if (!action) return;

    if (action === 'upload-invoice' && target.files && target.files[0]) {
      const file = target.files[0];
      if (!ALLOWED_IMAGE_TYPES.includes(file.type)) {
        actions.showToast('صيغة الملف غير مدعومة — يرجى اختيار صورة PNG أو JPG أو WebP');
        target.value = '';
        return;
      }
      if (file.size > MAX_IMAGE_BYTES) {
        actions.showToast('حجم الصورة كبير جداً (الحد الأقصى ١٠ ميجابايت)');
        target.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const safeUrl = sanitizeImageDataUrl(ev.target?.result);
        if (!safeUrl) {
          actions.showToast('تعذر التحقق من أمان الصورة المرفوعة');
          return;
        }
        stopDeviceCamera();
        actions.setCameraState('idle', '');
        await actions.completeCapture(safeUrl);
      };
      reader.readAsDataURL(file);
    } else if (action === 'draft-supplier-select') {
      if (target.value === '__custom__') {
        actions.updateDraftFieldAndRender('supplierName', '', { customSupplierMode: true });
      } else {
        actions.updateDraftFieldAndRender('supplierName', target.value, { customSupplierMode: false });
      }
    } else if (action === 'select-preset') {
      if (target.value === '__custom__') {
        actions.enableCustomItemName(target.dataset.itemId);
      } else {
        actions.applyItemPreset(target.dataset.itemId, target.value);
      }
    } else if (action === 'item-date-input') {
      actions.updateItemField(target.dataset.itemId, target.dataset.field, target.value);
      renderApp(getState());
    }
  });

  document.addEventListener('input', (e) => {
    const target = e.target;
    const action = target.dataset?.action;
    if (!action) return;

    if (action === 'draft-input') {
      const field = target.dataset.field;
      const num = Number(target.value);
      const val = target.type === 'number' ? (Number.isFinite(num) ? Math.max(0, num) : 0) : target.value;
      actions.updateDraftField(field, val);
    } else if (action === 'item-text-input') {
      actions.updateItemField(target.dataset.itemId, target.dataset.field, target.value);
    } else if (action === 'item-input') {
      const itemId = target.dataset.itemId;
      const field = target.dataset.field;
      const num = Number(target.value);
      const val = Number.isFinite(num) ? Math.max(field === 'piecesPerCarton' ? 1 : 0, num) : 0;
      actions.updateItemField(itemId, field, val);
      syncItemDerivedDom(itemId);
    }
  });
}

document.addEventListener('DOMContentLoaded', () => {
  subscribe(renderApp);
  setupEventDelegation();
  const initialState = getState();
  renderApp(initialState);
  if (initialState.wasRecovered) {
    actions.showToast('تم استعادة الفاتورة غير المكتملة تلقائياً');
  }
});
})();
  </script>
</body>
</html>
